# Define all pipelines to include.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
      when: always
    - when: always


stages:
  - pre-build
  - pre-test
  - build
  - post-build
  - post-test
  - review
  - clean
  - deliver


include:
  # --------------------------------------------------------------
  # Backend container image.
  # --------------------------------------------------------------

  # Continuous Integration pipeline for the backend container.
  - component: $CI_SERVER_FQDN/cdso/cdso/review@main
    inputs:
      name: backend
      pipeline_type: application-container
      cdso_config_path: .gitlab/expedition-0/dev/cdso_config.yml

  # Continuous Delivery pipeline for the backend container.
  - component: $CI_SERVER_FQDN/ai2c/caravan/pipelines/deliver@main
    inputs:
      name: backend
      pipeline_type: container
      environment: dev
      cdso_config_path: .gitlab/expedition-0/dev/cdso_config.yml
      application_name: "mission-clock"

  # --------------------------------------------------------------
  # Frontend container image.
  # --------------------------------------------------------------

  # Continuous Integration pipeline for the frontend container.
  - component: $CI_SERVER_FQDN/cdso/cdso/review@main
    inputs:
      name: frontend
      pipeline_type: application-container
      cdso_config_path: .gitlab/expedition-0/dev/cdso_config.yml

  # Continuous Delivery pipeline for the frontend container.
  - component: $CI_SERVER_FQDN/ai2c/caravan/pipelines/deliver@main
    inputs:
      name: frontend
      pipeline_type: container
      environment: dev
      cdso_config_path: .gitlab/expedition-0/dev/cdso_config.yml
      application_name: "mission-clock"
