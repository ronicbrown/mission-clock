# Services route internal cluster traffic stably to your running pods
apiVersion: v1
kind: Service
metadata:
  # The DNS name other pods in this namespace will use to find the backend
  name: backend-service
spec:
  # Matches the labels configured on the backend deployment
  selector:
    app: backend
  ports:
    - protocol: TCP
      # The port other pods inside the cluster will use to talk to this service
      port: 8000
      # The port inside your FastAPI container (matches backend Dockerfile & deployment)
      targetPort: 8000
